spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false   # DDL handled by ddl-auto: create-drop in tests

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: none        # Disable Redis-backed cache in unit/slice tests